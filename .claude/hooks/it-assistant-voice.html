<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IT Assistant voice hook</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<style>
  body { font-family: system-ui, sans-serif; background: #f3f6fa; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  button { font-size: 18px; padding: 16px 28px; border: 0; border-radius: 999px; background: #2a6fd1; color: #fff; cursor: pointer; }
  button:hover { background: #1a56a8; }
  p { color: #33415c; }
</style>
</head>
<body>
<main style="text-align:center">
  <h1>IT Assistant voice hook</h1>
  <p>Click the button to fire the hook — it speaks the greeting.</p>
  <button id="bot" type="button">🤖 Click the IT assistant</button>
  <p id="msg" role="status"></p>
</main>
<script>
  // Hook: runs on every click of the chatbot widget. Same logic as index.html section 17.
  const GREETING = "I am your IT assistant, how can i help you?";
  document.getElementById("bot").addEventListener("click", () => {
    document.getElementById("msg").textContent = GREETING;
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(GREETING);
    u.lang = "en-US"; u.pitch = 1.3;
    speechSynthesis.speak(u);
  });
</script>
</body>
</html>
